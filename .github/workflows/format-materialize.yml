name: Format Materialize

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/03-local-offline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier apps/web/src/lib/indexeddb/mdp-local-db.test.ts --write
      - name: Commit formatted test
        run: |
          if git diff --quiet -- apps/web/src/lib/indexeddb/mdp-local-db.test.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/indexeddb/mdp-local-db.test.ts
          git commit -m "style(slice03): apply project formatter"
          git push origin HEAD:slice/03-local-offline
