name: Lockfile Preview

on:
  pull_request:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Show lockfile delta
        run: git diff -- pnpm-lock.yaml
