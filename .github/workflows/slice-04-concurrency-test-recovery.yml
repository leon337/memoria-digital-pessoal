name: Slice 04 Concurrency Test Recovery

on:
  push:
    branches:
      - slice/04-synchronization

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply the minimal async-observation test correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/lib/sync/sync-engine.test.ts')
          text = path.read_text()
          old = """    expect(second).toBe(first);\n    expect(api.pull).toHaveBeenCalledTimes(1);\n    resolvePull(emptyPull());\n"""
          new = """    expect(second).toBe(first);\n    await vi.waitFor(() => expect(api.pull).toHaveBeenCalledTimes(1));\n    resolvePull(emptyPull());\n"""
          if text.count(old) != 1:
              raise SystemExit('expected concurrency assertion snippet not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit the test correction
        run: |
          if git diff --quiet; then
            echo "No correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/sync/sync-engine.test.ts
          git commit -m "test(slice-04): await concurrent sync observation"
          git push origin HEAD:slice/04-synchronization
