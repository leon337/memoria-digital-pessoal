name: Slice03 TDD

on:
  push:
    branches:
      - slice/03-local-offline

permissions:
  contents: write

jobs:
  web-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/03-local-offline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply project formatter
        run: pnpm exec prettier apps/web/src apps/web/vite.config.ts apps/web/tsconfig.app.json apps/web/index.html scripts/verify-slice03-pwa.mjs tests/architecture --write
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- apps/web/src apps/web/vite.config.ts apps/web/tsconfig.app.json apps/web/index.html scripts/verify-slice03-pwa.mjs tests/architecture; then
            echo "Formatting already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src apps/web/vite.config.ts apps/web/tsconfig.app.json apps/web/index.html scripts/verify-slice03-pwa.mjs tests/architecture
            git commit -m "style(slice03): apply project formatter"
            git push origin HEAD:slice/03-local-offline
          fi
      - run: pnpm build:packages
      - run: pnpm --filter @mdp/web typecheck
      - run: pnpm --filter @mdp/web test
      - run: pnpm --filter @mdp/web build
      - run: node scripts/verify-slice03-pwa.mjs
