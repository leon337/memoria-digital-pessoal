name: Slice03 TDD

on:
  push:
    branches:
      - slice/03-local-offline

permissions:
  contents: write

jobs:
  web-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/03-local-offline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Apply project formatter
        run: pnpm exec prettier apps/web/src tests/architecture --write
      - name: Commit lockfile or formatter output when needed
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/web/src tests/architecture; then
            echo "Generated files already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml apps/web/src tests/architecture
            git commit -m "chore(slice03): materialize generated project files"
            git push origin HEAD:slice/03-local-offline
          fi
      - run: pnpm build:packages
      - run: pnpm --filter @mdp/web typecheck
      - run: pnpm exec prettier apps/web/src tests/architecture --check
      - run: pnpm --filter @mdp/web test
