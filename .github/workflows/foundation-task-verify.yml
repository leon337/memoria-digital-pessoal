name: FOUNDATION task verification

on:
  push:
    branches: [foundation/repository-bootstrap]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mdp/shared test
      - run: pnpm -r --filter './packages/*' typecheck
      - run: pnpm build:packages
      - run: pnpm --filter @mdp/shared exec node -e "import('@mdp/shared').then(m=>{if(!m.createId || m.createId()[14]!=='7') process.exit(1)})"
