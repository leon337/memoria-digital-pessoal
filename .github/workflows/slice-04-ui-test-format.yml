name: Slice 04 UI Test Format

on:
  push:
    branches:
      - slice/04-synchronization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier apps/web/src/features/sync/slice-04-ui.test.tsx --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/sync/slice-04-ui.test.tsx
          git commit -m "style(slice-04): format UI contract test"
          git push origin HEAD:slice/04-synchronization
