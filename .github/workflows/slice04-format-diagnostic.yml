name: Slice 04 Format Diagnostic

on:
  push:
    branches:
      - slice/04-synchronization
    paths:
      - .github/workflows/slice04-format-diagnostic.yml
      - tests/architecture/slice-02-scope.test.ts

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier tests/architecture/slice-02-scope.test.ts --write
          git diff -- tests/architecture/slice-02-scope.test.ts
          test -z "$(git status --porcelain -- tests/architecture/slice-02-scope.test.ts)"
