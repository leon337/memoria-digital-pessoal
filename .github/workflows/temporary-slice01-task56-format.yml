name: Temporary Slice01 Task56 Format

on:
  push:
    branches:
      - slice/01-trusted-text-memory

permissions:
  contents: write

jobs:
  format-task56:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/01-trusted-text-memory
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format exact Task 5-6 allowlist
        run: >-
          pnpm exec prettier --write
          .github/workflows/ci.yml
          apps/api/src/app.module.ts
          apps/api/src/memories/memory.controller.ts
          apps/api/src/memories/memory.controller.test.ts
          apps/api/src/memories/memory.service.ts
          apps/api/src/memories/memory.store.ts
          apps/api/src/infrastructure/persistence/prisma/prisma-memory.store.ts
          apps/web/src/App.tsx
          apps/web/src/App.test.tsx
          apps/web/src/index.css
          apps/web/src/lib/memory-api.ts
          apps/web/src/lib/memory-api.test.ts
          apps/web/src/features/memory/StoreMemoryForm.tsx
          apps/web/src/features/memory/StoreMemoryForm.test.tsx
          apps/web/src/features/memory/QueryMemoryForm.tsx
          apps/web/src/features/memory/QueryMemoryForm.test.tsx
      - name: Refuse any diff outside allowlist
        shell: bash
        run: |
          allowed='^(\.github/workflows/ci\.yml|apps/api/src/app\.module\.ts|apps/api/src/memories/memory\.(controller|controller\.test|service|store)\.ts|apps/api/src/infrastructure/persistence/prisma/prisma-memory\.store\.ts|apps/web/src/(App(\.test)?\.tsx|index\.css|lib/memory-api(\.test)?\.ts|features/memory/(StoreMemoryForm|QueryMemoryForm)(\.test)?\.tsx))$'
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit formatting when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Allowlisted files already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml apps/api/src/app.module.ts apps/api/src/memories apps/api/src/infrastructure/persistence/prisma/prisma-memory.store.ts apps/web/src
          git commit -m 'style: format Slice 01 HTTP and web files'
          git push origin HEAD:slice/01-trusted-text-memory
