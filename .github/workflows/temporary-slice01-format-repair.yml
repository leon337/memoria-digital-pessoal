name: Temporary Slice01 Format Repair

on:
  push:
    branches:
      - slice/01-trusted-text-memory

permissions:
  contents: write

jobs:
  format-allowlisted-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/01-trusted-text-memory
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format exact allowlist
        run: >-
          pnpm exec prettier --write
          artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY/PHASE-01-DECISIONS.md
          artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY/PHASE-01-PLAN.md
          packages/contracts/src/memory.test.ts
          packages/contracts/src/memory.ts
          packages/domain/src/index.ts
          packages/domain/src/memory.ts
      - name: Refuse any diff outside allowlist
        shell: bash
        run: |
          allowed='^(artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY/PHASE-01-(DECISIONS|PLAN)\.md|packages/contracts/src/memory(\.test)?\.ts|packages/domain/src/(index|memory)\.ts)$'
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit formatting when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Allowlisted files already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY/PHASE-01-DECISIONS.md \
            artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY/PHASE-01-PLAN.md \
            packages/contracts/src/memory.test.ts \
            packages/contracts/src/memory.ts \
            packages/domain/src/index.ts \
            packages/domain/src/memory.ts
          git commit -m 'style: format Slice 01 task 1 files'
          git push origin HEAD:slice/01-trusted-text-memory
