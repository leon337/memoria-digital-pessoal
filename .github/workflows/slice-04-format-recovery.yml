name: Slice 04 Format Recovery

on:
  push:
    branches:
      - slice/04-synchronization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format only the CI-identified Slice 04 files
        run: >-
          pnpm exec prettier
          apps/web/src/lib/sync/sync-engine.ts
          apps/web/src/lib/sync/sync-engine.test.ts
          --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/sync/sync-engine.ts apps/web/src/lib/sync/sync-engine.test.ts
          git commit -m "style(slice-04): apply canonical formatting"
          git push origin HEAD:slice/04-synchronization
