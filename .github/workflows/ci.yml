name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: '3000'
      DATABASE_URL: postgresql://mdp:mdp_local_only@127.0.0.1:5432/mdp
      WEB_ORIGIN: http://127.0.0.1:5173
      VITE_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            id="$(docker compose ps -q postgres)"
            [ -n "$id" ] && [ "$(docker inspect --format='{{.State.Health.Status}}' "$id")" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm db:migrate
      - name: Assert no product tables
        run: |
          count="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename <> '_prisma_migrations';")"
          test "$count" = "0"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Verify workspace runtime import
        run: pnpm --filter @mdp/shared exec node -e "import('@mdp/shared').then(m=>{if(!m.createId || m.createId()[14]!=='7') process.exit(1)})"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Verify live and ready degradation with real PostgreSQL outage
        run: |
          pnpm --filter @mdp/api start >/tmp/mdp-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/health/live >/tmp/live-healthy.json && break
            sleep 1
          done

          live_healthy="$(curl -sS -o /tmp/live-healthy.json -w '%{http_code}' http://127.0.0.1:3000/health/live)"
          ready_healthy="$(curl -sS -o /tmp/ready-healthy.json -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          docker compose stop postgres
          live_db_down="$(curl -sS -o /tmp/live-db-down.json -w '%{http_code}' http://127.0.0.1:3000/health/live)"
          ready_db_down="$(curl -sS -o /tmp/ready-db-down.json -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          docker compose start postgres

          printf 'healthy live=%s ready=%s\n' "$live_healthy" "$ready_healthy"
          printf 'db-down live=%s ready=%s\n' "$live_db_down" "$ready_db_down"
          cat /tmp/live-healthy.json
          cat /tmp/ready-healthy.json
          cat /tmp/live-db-down.json
          cat /tmp/ready-db-down.json

          test "$live_healthy" = "200"
          test "$ready_healthy" = "200"
          test "$live_db_down" = "200"
          test "$ready_db_down" = "503"
      - if: always()
        run: docker compose down
