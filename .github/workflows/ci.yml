name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: '3000'
      DATABASE_URL: postgresql://mdp:mdp_local_only@127.0.0.1:5432/mdp
      WEB_ORIGIN: http://127.0.0.1:5173
      VITE_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            id="$(docker compose ps -q postgres)"
            [ -n "$id" ] && [ "$(docker inspect --format='{{.State.Health.Status}}' "$id")" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm db:migrate
      - name: Assert exact Slice 02 product tables
        run: |
          actual="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT COALESCE(string_agg(tablename, ',' ORDER BY tablename), '') FROM pg_tables WHERE schemaname='public' AND tablename <> '_prisma_migrations';")"
          expected="current_facts,evidence,facts,ledger_events,memories"
          printf 'actual=%s\nexpected=%s\n' "$actual" "$expected"
          test "$actual" = "$expected"
      - name: Assert Slice 02 correction schema
        run: |
          fact_lineage_column="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='facts' AND column_name='supersedes_fact_id' AND data_type='uuid';")"
          fact_lineage_unique="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='facts' AND indexname='facts_supersedes_fact_id_key' AND indexdef ILIKE 'CREATE UNIQUE INDEX%';")"
          ledger_columns="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='ledger_events' AND ((column_name IN ('fact_id','supersedes_fact_id') AND data_type='uuid') OR (column_name='reason' AND data_type='character varying' AND character_maximum_length=500));")"
          correction_check="$(docker compose exec -T postgres psql -U mdp -d mdp -tAc "SELECT count(*) FROM pg_constraint WHERE conname='ledger_events_memory_corrected_fact_links_check' AND conrelid='ledger_events'::regclass;")"
          printf 'fact_lineage_column=%s fact_lineage_unique=%s ledger_columns=%s correction_check=%s\n' "$fact_lineage_column" "$fact_lineage_unique" "$ledger_columns" "$correction_check"
          test "$fact_lineage_column" = "1"
          test "$fact_lineage_unique" = "1"
          test "$ledger_columns" = "3"
          test "$correction_check" = "1"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Verify Slice 01 PRF manifest
        working-directory: artifacts/phases/SLICE-01-TRUSTED-TEXT-MEMORY
        run: sha256sum -c PHASE-01-ARTIFACT-MANIFEST.sha256
      - name: Verify Slice 02 PRF manifest
        working-directory: artifacts/phases/SLICE-02-CORRECTION-HISTORY
        run: sha256sum -c PHASE-02-ARTIFACT-MANIFEST.sha256
      - run: pnpm test
      - run: pnpm build
      - name: Verify workspace runtime import
        run: pnpm --filter @mdp/shared exec node -e "import('@mdp/shared').then(m=>{if(!m.createId || m.createId()[14]!=='7') process.exit(1)})"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Verify live and ready degradation with real PostgreSQL outage
        run: |
          pnpm --filter @mdp/api start >/tmp/mdp-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/health/live >/tmp/live-healthy.json && break
            sleep 1
          done

          live_healthy="$(curl -sS -o /tmp/live-healthy.json -w '%{http_code}' http://127.0.0.1:3000/health/live)"
          ready_healthy="$(curl -sS -o /tmp/ready-healthy.json -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          node scripts/verify-slice02-correction-outage.mjs prepare
          docker compose stop postgres
          live_db_down="$(curl -sS -o /tmp/live-db-down.json -w '%{http_code}' http://127.0.0.1:3000/health/live)"
          ready_db_down="$(curl -sS -o /tmp/ready-db-down.json -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          memory_db_down="$(curl --max-time 15 -sS -o /tmp/memory-db-down.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"text":"Registro sintético de indisponibilidade."}' http://127.0.0.1:3000/memories)"
          node scripts/verify-slice02-correction-outage.mjs verify
          docker compose start postgres

          printf 'healthy live=%s ready=%s\n' "$live_healthy" "$ready_healthy"
          printf 'db-down live=%s ready=%s memory=%s\n' "$live_db_down" "$ready_db_down" "$memory_db_down"
          cat /tmp/live-healthy.json
          cat /tmp/ready-healthy.json
          cat /tmp/live-db-down.json
          cat /tmp/ready-db-down.json
          cat /tmp/memory-db-down.json

          test "$live_healthy" = "200"
          test "$ready_healthy" = "200"
          test "$live_db_down" = "200"
          test "$ready_db_down" = "503"
          test "$memory_db_down" = "503"
          grep -q '"code":"SERVICE_UNAVAILABLE"' /tmp/memory-db-down.json
          ! grep -q 'Registro sintético' /tmp/memory-db-down.json
          ! grep -qi 'sql' /tmp/memory-db-down.json
      - if: always()
        run: docker compose down
