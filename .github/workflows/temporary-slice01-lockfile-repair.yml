name: Temporary Slice01 Lockfile Repair

on:
  push:
    branches:
      - slice/01-trusted-text-memory

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/01-trusted-text-memory
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Refuse any diff outside pnpm-lock.yaml
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^pnpm-lock.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit refreshed lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = "pnpm-lock.yaml"
          git commit -m 'chore: refresh pnpm lockfile for Slice 01'
          git push origin HEAD:slice/01-trusted-text-memory
