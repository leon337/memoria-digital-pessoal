name: Slice 04 Package TDD

on:
  pull_request:
    paths:
      - .github/workflows/slice-04-tdd.yml
      - packages/contracts/src/**
      - packages/domain/src/**
  push:
    branches:
      - slice/04-synchronization
    paths:
      - .github/workflows/slice-04-tdd.yml
      - packages/contracts/src/**
      - packages/domain/src/**

permissions:
  contents: read

jobs:
  package-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/contracts/src packages/domain/src
      - run: pnpm build:packages
      - run: pnpm -r --filter './packages/*' --if-present typecheck
      - run: pnpm exec eslint packages/contracts/src packages/domain/src
      - run: pnpm exec prettier packages/contracts/src packages/domain/src --check
