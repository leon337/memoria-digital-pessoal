services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mdp
      POSTGRES_USER: mdp
      POSTGRES_PASSWORD: mdp_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mdp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mdp -d mdp']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  mdp_postgres_data:
